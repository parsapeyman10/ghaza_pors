name: ساخت فایل پرتابل (exe)

# با هر push روی تگ v* یا اجرای دستی، فایل‌های اجرایی پرتابل ساخته و
# روی Releases قرار می‌گیرد (نیازی به نصب هیچ چیزی روی کامپیوتر شما نیست).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ساخت exe برای ویندوز / لینوکس / مک
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها (فقط برای build)
        run: npm ci

      - name: اطمینان از به‌روز بودن موتور SQLite داخل server/vendor
        run: node scripts/make-vendor.js

      - name: تست‌ها (دیتابیس، API، رابط کاربری)
        run: npm run check

      - name: ساخت فایل‌های اجرایی
        run: |
          npx pkg . --targets node22-win-x64      --output dist/GhazaPors.exe
          npx pkg . --targets node22-linux-x64    --output dist/GhazaPors-linux
          npx pkg . --targets node22-macos-x64    --output dist/GhazaPors-mac

      - name: تست فایل اجرایی (لینوکس)
        run: node scripts/exe-smoke.js dist/GhazaPors-linux

      - name: ساخت پک‌های پرتابل (ZIP)
        run: node scripts/make-dist.js

      - uses: actions/upload-artifact@v4
        with:
          name: portable-app
          path: dist/*.zip
          if-no-files-found: error

      - name: آپلود exe خام (برای تست روی ویندوز و برای استفادهٔ مستقیم)
        uses: actions/upload-artifact@v4
        with:
          name: exe-files
          path: |
            dist/GhazaPors.exe
            dist/GhazaPors-linux
            dist/GhazaPors-mac

      - name: انتشار روی Releases (فقط با تگ)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            فایل پرتابل دفترچهٔ شماره‌های داخلی.

            **ویندوز:** `GhazaPors-win-x64.zip` را دانلود و در یک پوشه باز کنید، بعد `start.bat`
            (یا `GhazaPors.exe`) را اجرا کنید — مرورگر خودش آدرس برنامه را باز می‌کند.
            دیتابیس داخل پوشهٔ `data` همان برنامه می‌ماند؛ برای بردن اطلاعات به جای دیگر کل پوشه را کپی کنید.

            لینوکس: `GhazaPors-linux-x64.zip` · مک: `GhazaPors-macos-x64.zip`

  windows-smoke:
    name: تست exe روی ویندوز واقعی
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: exe-files
          path: .   # داخل artifact پوشهٔ dist است → فایل‌ها می‌آیند روی dist/

      - name: اجرا و تست GhazaPors.exe
        shell: bash
        run: node scripts/exe-smoke.js dist/GhazaPors.exe
